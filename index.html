<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#02020b">

    <title>❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="universe">

        <!-- PARTICLE HEART -->
        <canvas id="heartCanvas"></canvas>

        <!-- LOVE MESSAGE -->
        <div class="message-container">
            <h1 id="loveMessage">I see a future with you.</h1>
        </div>

        <!-- MUSIC CONTROL -->
        <button id="musicButton" aria-label="Pause music">
            <span id="musicIcon">Ⅱ</span>
        </button>

    </main>

    <!-- BACKGROUND MUSIC -->
    <audio
        id="backgroundMusic"
        src="music.mp3"
        autoplay
        loop
        preload="auto">
    </audio>

    <script src="script.js"></script>

</body>
</html>
